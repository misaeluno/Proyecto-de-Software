<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar sesión</title>

/*carga de estilos*/
<link rel="stylesheet" href="../Estilos_carpeta/Estilos.css">
/*carga de scripts*/
<script src="../Base_Datos/Clientes.js"></script>
<script src="../Backend/Carga_base_datos.js"></script>

</head>
<body>

  <header class="navbar">
    <div class="nav-brand">Mi Sitio</div>
    <a class="nav-circle-btn" href="Inicio_sesion.html" aria-label="Volver al inicio">
      <svg class="nav-avatar-icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <circle cx="50" cy="34" r="19"/>
        <ellipse cx="50" cy="100" rx="40" ry="38"/>
      </svg>
    </a>
  </header>

  <main class="login-main">
    <div class="login-card">
      <h1 class="login-title">Iniciar sesión</h1>
      <form action="#" method="post">
        <div class="login-field">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autocomplete="username" required>
        </div>
        <div class="login-field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-submit">Ingresar</button>
      </form>
      <a class="login-back" href="Gestionar.html">← Volver al inicio</a>
    </div>
  </main>

  <footer class="site-footer">
    © 2026 Mi Sitio. Todos los derechos reservados.
  </footer>

</body>
</html>
