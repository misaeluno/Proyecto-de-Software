<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detalles del Cliente</title>

<link rel="stylesheet" href="../Estilos_carpeta/Estilos.css">

  <main>

      <!-- Título dinámico con los datos del cliente -->
      <h2 id="titulo-cliente" style="text-align: center; margin-top: 0;">Cargando datos...</h2>

            <tr>
              <th>Fecha</th>
